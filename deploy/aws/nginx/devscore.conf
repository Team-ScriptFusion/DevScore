# DevScore reverse proxy — one server block per subdomain, each forwarding
# to the matching systemd service on localhost. Run `sudo certbot --nginx
# -d api.madhushan.me -d cvparser.madhushan.me -d engine.madhushan.me`
# AFTER this file is in place — certbot rewrites these blocks in place to
# add the listen 443/ssl_certificate directives, so start on plain HTTP.

server {
    listen 80;
    server_name api.madhushan.me;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name cvparser.madhushan.me;

    # Resume PDFs — cv_parser accepts uploads, keep the body-size ceiling
    # in sync with server/src/controllers/resumeController.js's 5MB cap.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name engine.madhushan.me;

    client_max_body_size 10m;

    # Scoring can legitimately take tens of seconds (GitHub mining) —
    # match gunicorn's --timeout 90 on the upstream service so nginx
    # doesn't cut the connection first.
    proxy_read_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
